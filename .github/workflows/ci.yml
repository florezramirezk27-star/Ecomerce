name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci?schema=public
      - run: pnpm --dir api build
      - run: pnpm --dir api exec jest --runInBand

      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web build

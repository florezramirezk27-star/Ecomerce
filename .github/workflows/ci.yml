name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Imagen con pgvector para que `prisma migrate deploy` pueda aplicar la
        # migración que crea la extensión vector. Es una base temporal y
        # aislada: nunca se usa Neon en CI.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kronio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kronio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kronio_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kronio_test?schema=public
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kronio_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations to temporary PostgreSQL
        run: pnpm exec prisma migrate deploy

      - run: pnpm --dir api build

      - name: Unit tests
        run: pnpm --dir api exec jest --runInBand

      - name: Integration tests (PostgreSQL real)
        run: pnpm --dir api test:integration

      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --dir apps/web lint
      - name: Build frontend
        run: pnpm --dir apps/web build
        env:
          API_URL: https://ecomerce-vslf.onrender.com
          NEXT_PUBLIC_WS_URL: https://ecomerce-vslf.onrender.com
